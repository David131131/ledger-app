<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>做账 · 随身账本</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/store.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <header><div><span class="eyebrow">LEDGER / 随身账本</span><h1>记下每一笔。</h1></div><span class="badge">电脑本地存储</span></header>
  <main>
    <section class="card connection" aria-label="同步状态">
      <div class="status-row"><strong id="status" role="status">正在读取手机数据…</strong><button id="sync" type="button">立即同步</button></div>
      <p id="last-sync">尚未连接电脑</p><p id="offline-ready">正在准备离线页面…</p>
      <p id="device-status">首次连接后会记住此设备，无需每次输入密钥。</p>
      <p id="message" role="alert"></p>
    </section>
    <details id="connection" class="card">
      <summary id="connection-title">首次连接电脑</summary>
      <p id="pair-help">先在电脑「做账 → 手机同步」中启用服务。只需首次输入连接密钥，连接成功后会自动记住。</p>
      <form id="pair-form"><label>连接密钥<input id="token" type="password" required autocomplete="off" spellcheck="false" placeholder="粘贴电脑显示的密钥"></label><button class="primary" type="submit">连接这个账本</button></form>
      <button id="change-token" type="button" hidden>更换连接密钥</button>
      <p>添加到手机主屏幕后使用。电脑离线时账单暂存在此设备，恢复连接并打开本页后自动同步。未同步前请勿清理网站数据或卸载网页应用。</p>
      <button id="export" type="button">导出手机待同步记录</button>
    </details>
    <section class="card">
      <h2>记一笔 <span>先保存到手机，再自动同步</span></h2>
      <form id="record-form">
        <fieldset id="entry-fields" disabled>
          <div class="two"><label>类型<select name="type"><option value="expense">支出</option><option value="income">收入</option></select></label><label>币种<select name="currency"><option value="CNY">人民币 ¥</option><option value="USD">美元 $</option></select></label></div>
          <label>金额<input class="amount" name="amount" type="number" inputmode="decimal" min="0.01" max="10000000000" step="0.01" placeholder="0.00" required></label>
          <div class="two"><label>日期<input name="date" type="date" required></label><label>分类<input name="category" list="categories" maxlength="100" placeholder="如：餐饮" required></label></div>
          <datalist id="categories"><option value="餐饮"><option value="交通"><option value="购物"><option value="娱乐"><option value="住房"><option value="工资"><option value="其他"></datalist>
          <label>消费路径<input name="path" maxlength="100" placeholder="在哪里消费（选填）"></label>
          <label>备注<input name="note" maxlength="2000" placeholder="想补充点什么（选填）"></label>
          <button id="save" class="primary" type="submit">保存账单</button>
        </fieldset>
      </form>
    </section>
    <section class="card"><h2>待同步 <span id="pending-count">0 笔</span></h2><div id="pending-list"></div></section>
    <section class="card"><h2>电脑账本 <span id="record-count"></span></h2><p>显示最近同步的最多 1,000 笔；编辑、删除和完整报表请在电脑操作。</p><div id="records"></div></section>
  </main>
  <footer>你的电脑是账本主库 · 手机保留离线副本</footer>
</body>
</html>
